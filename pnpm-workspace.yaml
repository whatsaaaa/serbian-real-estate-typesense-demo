# pnpm installs no package younger than a day (minimumReleaseAge). Our own packages are let in
# as soon as they are published, so a project can take a release of them right away.
minimumReleaseAgeExclude:
  - '@whatsaaaa/*'

# A dependency's install script runs only when allowBuilds lists it: true to run it, false to
# skip it, each with a comment that says why.
allowBuilds:
  # esbuild's postinstall verifies its native binary at install time, which this project chose
  # to run when the Nuxt app was set up
  esbuild: true
  # vue-demi's postinstall only switches it to its Vue 2 build when it finds Vue 2. It ships the
  # Vue 3 build this project uses, so there is nothing for the script to do
  vue-demi: false
